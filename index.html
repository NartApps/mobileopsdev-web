      content="Software development and mobile application operations resources for iOS tools, App Store workflows, release operations, and developer utilities."
    />
    <meta property="og:url" content="https://mobileops.dev/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>MobileOps.dev</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MobileOps.dev",
        "url": "https://mobileops.dev/",
        "description": "Software development and mobile application operations domain for iOS tools, App Store workflows, release operations, and developer utilities.",
        "knowsAbout": [
          "Software development",
          "Mobile application development",
          "iOS development",
          "App Store operations",
          "Developer tools",
          "Release operations"
        ]
      }
    </script>

    <style>
      :root {
        color-scheme: dark;
        font-family:
          ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
        background: #050505;
        color: #f5f5f7;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 45%, #171717 0, #090909 28%, #050505 62%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.022;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      main {
        padding: 24px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        min-height: 38px;
        padding: 9px 14px 9px 11px;
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.055);
        box-shadow:
          0 14px 40px rgba(0, 0, 0, 0.45),
          inset 0 1px rgba(255, 255, 255, 0.055);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
        cursor: default;
        animation: appear 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .apple {
        width: 17px;
        height: 20px;
        flex: none;
        fill: currentColor;
      }

      .label {
        font-size: 12px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.01em;
        color: rgba(245, 245, 247, 0.88);
      }

      .cursor {
        width: 5px;
        height: 13px;
        margin-left: -3px;
        border-radius: 1px;
        background: #7dff9b;
        box-shadow: 0 0 12px rgba(125, 255, 155, 0.5);
        animation: blink 1.1s steps(1) infinite;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.98);
          filter: blur(3px);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      @keyframes blink {
        50% {
          opacity: 0.15;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pill {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <div class="pill" aria-label="mobileops.dev">
        <svg class="apple" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.71 12.37c.02 3.25 2.85 4.34 2.88 4.36-.02.08-.45 1.55-1.49 3.07-.9 1.31-1.84 2.61-3.31 2.64-1.44.03-1.91-.86-3.57-.86-1.65 0-2.17.83-3.54.89-1.42.05-2.51-1.43-3.42-2.74-1.86-2.69-3.28-7.6-1.37-10.92a5.33 5.33 0 0 1 4.52-2.73c1.41-.03 2.74.95 3.57.95.83 0 2.39-1.18 4.02-1.01.69.03 2.61.28 3.84 2.08-.1.06-2.29 1.34-2.13 4.27ZM15.93 4.3c.75-.91 1.26-2.18 1.12-3.44-1.08.04-2.39.72-3.17 1.63-.7.8-1.31 2.1-1.15 3.33 1.21.09 2.44-.61 3.2-1.52Z" />
        </svg>
        <span class="label">mobileops.dev</span>
        <span class="cursor" aria-hidden="true"></span>
      </div>
    </main>
  </body>

</html>
